[tools]
uv = "0.5.11"
trunk = "1.3.4"
node = "22.11.0"

[tasks.install]
run = "uv sync --extra dev"
description = "Install the project in dev mode."

[tasks.fmt]
run = "trunk fmt"
description = "Format code using trunk."

[tasks.lint]
run = "trunk check"
description = "Run trunk linter."

[tasks."test:pytest"]
run = "uv run pytest -v --cov-config .coveragerc --cov=bumpkin -l --tb=short --maxfail=1 tests/"
description = "Run pytest."
depends = ["install"]

[tasks."test:coverage-xml"]
run = "uv run coverage xml"
description = "Generate coverage xml report."
depends = ["test:pytest"]

[tasks."test:coverage-html"]
run = "uv run coverage html"
description = "Generate coverage html report."
depends = ["test:pytest"]

[tasks.test]
description = "Run all tests."
depends = ["test:*"]

[tasks.ci]
description = "Run all checks for CI."
depends = ["lint", "test"]

[tasks.codegen]
run = "echo 'No codegen tasks defined'"
description = "Update any generated code."
